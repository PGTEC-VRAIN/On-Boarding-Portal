<div class="page-container">
    <app-toolbar [showUserMenu]="true" />
    <div class="content-area">
        <mat-card class="dashboard-card">
            <mat-card-header>
                <div class="header-container">
                    <button mat-icon-button (click)="goBack()" type="button" [matTooltip]="ui.t('review.back')">
                        <mat-icon>arrow_back</mat-icon>
                    </button>
                    <mat-card-title>{{ ui.t('review.title') }}</mat-card-title>
                </div>
            </mat-card-header>
            <br />
            <mat-card-content>
                @if(isLoading()){
                <mat-progress-bar mode="indeterminate" style="margin-top: 16px;" />
                }@else if (registration) {
                <app-admin-registration-details [registration]="registration" />
                } @else {
                <div class="error-container mat-elevation-z2">
                    <mat-icon class="error-icon">search_off</mat-icon>
                    <h2>{{ ui.t('review.notFoundTitle') }}</h2>
                    <p>{{ ui.t('review.notFoundBody') }}</p>
                    <button mat-flat-button color="primary" (click)="goBack()">
                        <mat-icon>arrow_back</mat-icon>
                        {{ ui.t('review.backToDashboard') }}
                    </button>
                </div>
                }
            </mat-card-content>
        </mat-card>
    </div>
</div>
