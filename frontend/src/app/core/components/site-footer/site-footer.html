<footer class="site-footer">
    <div class="pg-container footer-inner">
        <ul class="footer-logos" [attr.aria-label]="ui.t('footer.logosLabel')">
            <li>
                <a href="https://next-generation-eu.europa.eu/index_es" target="_blank" rel="noopener noreferrer">
                    <img class="logo-eu" src="/logos/logo_EU-NG_es.png" [alt]="ui.t('footer.altEu')" />
                </a>
            </li>
            <li>
                <a href="https://avance.digital.gob.es/" target="_blank" rel="noopener noreferrer">
                    <img class="logo-sedia" src="/logos/logo_MTDFP-SEDIA.png" [alt]="ui.t('footer.altSedia')" />
                </a>
            </li>
            <li>
                <a href="https://planderecuperacion.gob.es/" target="_blank" rel="noopener noreferrer">
                    <img class="logo-prtr" src="/logos/logo_PRTR.png" [alt]="ui.t('footer.altPrtr')" />
                </a>
            </li>
            <li>
                <a href="https://www.upv.es/" target="_blank" rel="noopener noreferrer">
                    <img class="logo-upv" src="/logos/logo_UPV.png" [alt]="ui.t('footer.altUpv')" />
                </a>
            </li>
            <li>
                <a href="https://cred.digital.gob.es/espacios-de-datos/lista-de-confianza-de-espacios-de-datos" target="_blank"
                    rel="noopener noreferrer">
                    <img class="logo-edc" src="/logos/logo_EDC.svg" [alt]="ui.t('footer.altEdc')" />
                </a>
            </li>
        </ul>

        <p class="footer-funding">{{ ui.t('footer.funding') }}</p>

        <div class="footer-bottom">
            <nav class="footer-links" [attr.aria-label]="ui.t('footer.links')">
                @if(documentUrl) {
                <a [href]="documentUrl" target="_blank" rel="noopener noreferrer">{{ ui.t('footer.agreement') }}</a>
                }
                <a routerLink="/submit" fragment="search">{{ ui.t('footer.status') }}</a>
                @if(ui.marketplaceUrl) {
                <a [href]="ui.marketplaceUrl" target="_blank" rel="noopener noreferrer">{{ ui.t('toolbar.marketplace') }}</a>
                }
                <a [href]="ui.projectWebsiteUrl" target="_blank" rel="noopener noreferrer">{{ ui.t('footer.project') }}</a>
                <a [href]="ui.connectorRepositoryUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
            </nav>
            <p class="copyright">
                &copy; {{ year }} {{ ui.t('footer.rights') }}
                <span aria-hidden="true">&middot;</span>
                <button type="button" class="admin-access" (click)="onAdminAccess()">
                    <app-icon icon="lock" [size]="14" />
                    {{ ui.t('footer.admin') }}
                </button>
            </p>
        </div>
    </div>
</footer>
